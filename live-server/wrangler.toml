# 씽크칩 아레나 실시간 대결 서버 (Cloudflare Workers 무료 플랜 + Durable Objects)
name = "thinkchip-live"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 친구 목록·선물함 (플레이어마다 하나)
[[durable_objects.bindings]]
name = "USER"
class_name = "User"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["User"]

# 관리자 계정 공개 ID (라운지 비서 데스크의 "내 ID"). 쉼표로 여러 개. 옷·가구가 전부 열려요
[vars]
ADMIN_PIDS = "6ed1070a82ab8dfec6e8bad6"

# 토스 인앱결제 주문 확인용 mTLS 인증서 (05_toss_mtls_upload_windows.cmd 로 올린 뒤 ID 를 넣고 주석을 풀어요)
# 이 바인딩이 없으면 지금처럼 주문번호 중복만 막고 지급해요
# [[mtls_certificates]]
# binding = "TOSS_MTLS"
# certificate_id = ""

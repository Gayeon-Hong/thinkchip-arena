# 씽크칩 아레나 실시간 대결 서버 (Cloudflare Workers 무료 플랜 + Durable Objects)
name = "thinkchip-live"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 친구 목록·선물함 (플레이어마다 하나)
[[durable_objects.bindings]]
name = "USER"
class_name = "User"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["User"]

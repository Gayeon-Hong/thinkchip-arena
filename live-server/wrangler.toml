# 씽크칩 아레나 실시간 대결 서버 (Cloudflare Workers 무료 플랜 + Durable Objects)
name = "thinkchip-live"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 친구 목록·선물함 (플레이어마다 하나)
[[durable_objects.bindings]]
name = "USER"
class_name = "User"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["User"]

# 관리자 계정 공개 ID (라운지 비서 데스크의 "내 ID"). 쉼표로 여러 개. 옷·가구가 전부 열려요
[vars]
ADMIN_PIDS = "6ed1070a82ab8dfec6e8bad6"

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>씽크칩 라운지 | THINKCHIP LOUNGE</title>
<link rel="icon" type="image/png" href="../icons/favicon-48.png">
<link rel="stylesheet" href="./lounge.css">
</head>
<body data-theme="night">
<canvas id="scene" aria-label="3D 라운지"></canvas>
<div id="labels" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#" id="brandBtn" title="라운지 정보">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="bmk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5f8bff"/><stop offset=".55" stop-color="#7660ff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient></defs><polygon points="20,3 34.7,11.5 34.7,28.5 20,37 5.3,28.5 5.3,11.5" fill="url(#bmk)" stroke="url(#bmk)" stroke-width="3" stroke-linejoin="round"/><path d="M20 10.5Q21.6 18.4 29.5 20Q21.6 21.6 20 29.5Q18.4 21.6 10.5 20Q18.4 18.4 20 10.5Z" fill="#fff"/></svg></span>
    <span><b>THINKCHIP LOUNGE</b><small id="roomLabel">공개 라운지</small></span>
  </a>
  <div class="where-toggle" id="whereToggle" role="group" aria-label="라운지·내 방 이동"><button data-w="lounge" class="on">🏛️<span>라운지</span></button><button data-w="home">🏠<span>내 방</span></button></div>
  <div class="top-right">
    <button class="online" id="online" aria-label="접속자·친구 목록"><i></i><b>1</b>명</button>
    <button class="pill name-pill" id="nameBtn" aria-label="내 이름 바꾸기" title="이름 바꾸기"><span aria-hidden="true">✏️</span><b id="nameLabel">나</b></button>
    <button class="pill chips" id="chipsBtn" aria-label="내 씽크칩"><span class="chip-dot">⬡</span><b id="chips">100</b></button>
    <button class="icon" id="viewBtn" aria-label="시점 바꾸기" title="시점 바꾸기">🎥</button>
    <button class="icon" id="themeBtn" aria-label="낮/밤 전환">☾</button>
  </div>
</header>

<div class="ticker" aria-live="polite"><span class="tag">LIVE</span><div class="ticker-track"><span id="tickerText">라운지에 오신 걸 환영해요</span></div></div>

<div class="sc-board" id="scBoard" hidden aria-live="polite"></div>
<aside class="people" id="people" hidden aria-label="접속자와 친구"></aside>

<nav class="dock-right" aria-label="라운지 메뉴">
  <button data-open="games"><span>🎮</span>게임</button>
  <button data-open="booth"><span>📸</span>네컷</button>
  <button data-open="closet"><span>👕</span>꾸미기</button>
  <button data-open="room"><span>🏠</span>내 방</button>
  <button data-open="desk"><span>💁</span>비서</button>
  <button data-open="friends"><span>👥</span>친구</button>
</nav>

<div class="hint" id="hint">바닥을 눌러 걸어가고, 테이블을 눌러 게임을 골라요</div>

<section class="chat" aria-label="라운지 채팅" id="chatPanel">
  <div class="chat-grip" id="chatGrip" role="slider" aria-label="채팅창 크기 · 위로 끌면 크게, 아래로 내리면 숨겨요" tabindex="0"><i></i></div>
  <div class="chat-log" id="chatLog"></div>
  <div class="emotes" id="emotes">
    <button data-sc="1" class="sc-btn" aria-label="전광판 슈퍼챗">📢</button>    <button data-emote="👋">👋</button><button data-emote="😂">😂</button><button data-emote="😮">😮</button><button data-emote="🤔">🤔</button>
    <button data-emote="😭">😭</button><button data-emote="😡">😡</button><button data-emote="😏">😏</button><button data-emote="🔥">🔥</button>
  </div>
  <form class="chat-bar" id="chatForm" autocomplete="off">
    <input id="chatInput" maxlength="80" placeholder="말 걸기 · 이모티콘을 쓰면 표정이 바뀌어요" enterkeyhint="send">
    <button type="submit">전송</button>
  </form>
</section>
<button type="button" class="chat-reopen" id="chatReopen" aria-label="채팅 열기" hidden>💬</button>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grip"></div>
  <div class="sheet-head"><div><small id="sheetKicker"></small><h2 id="sheetTitle"></h2></div><button class="icon" id="sheetClose" aria-label="닫기">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="toast" id="toast" role="status"></div>
<div class="loading" id="loading"><div class="spinner"></div><p>라운지 준비 중…</p></div>

<script src="../vendor/three.min.js"></script>
<script src="./config.js"></script>
<script src="../account.js"></script>
<script src="./avatar.js"></script>
<script src="./lounge.js"></script>
</body>
</html>

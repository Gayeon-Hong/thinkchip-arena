# live-server/ 가 바뀐 채로 main 에 푸시하면 실시간 서버(친구·선물·파티 방)를 Cloudflare Workers 에 자동 배포해요.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts 편집 권한), CLOUDFLARE_ACCOUNT_ID
name: Deploy live server (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths: ['live-server/**']
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare Workers 배포
        working-directory: live-server
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 서버 응답 확인
        run: curl -fsS https://thinkchip-live.000000000078.workers.dev/health
